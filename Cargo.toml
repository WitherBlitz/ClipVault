[package]
name = "clipvault"
version = "0.2.0"
edition = "2024"
description = "Native Windows clipboard history with LAN and Tailscale PC tabs"
license = "MIT"
repository = "https://github.com/WitherBlitz/ClipVault"
build = "build.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
sha2 = "0.10.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
